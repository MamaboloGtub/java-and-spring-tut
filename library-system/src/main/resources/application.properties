spring.application.name=library-system
server.port=8083

# Database Connection Properties
spring.datasource.url=jdbc:postgresql://localhost:5432/library
spring.datasource.username=tshepo_tests
spring.datasource.password=Tshepo@123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool Properties
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=60000

# Test Properties (often for connection validation)
spring.datasource.test-while-idle=true
spring.datasource.validation-query=SELECT 1

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true 
spring.flyway.locations=classpath:db/migration 
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}

# Swagger UI config (optional, but helps with discoverability)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

api.source=library-system-api

