name: Build GraphQL Tutorial

on:
  push:
    paths:
      - 'graphql-tutorial/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'graphql-tutorial/**'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: graphql-tutorial

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U graphql_user; then
              echo "Postgres is ready"
              break
            fi
            echo "Waiting for postgres..."
            sleep 3
          done

      - name: Set environment variables for CI
        run: |
          echo "SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/${{ secrets.DB_NAME }}" >> $GITHUB_ENV
          echo "SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USERNAME }}" >> $GITHUB_ENV
          echo "SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "SPRING_PROFILES_ACTIVE=ci" >> $GITHUB_ENV

      - name: Build with Maven using CI profile
        run: mvn -B clean package -Dspring.profiles.active=ci

      - name: Submit Maven Dependency graph
        run: |
          cd graphql-tutorial
          mvn com.github.ferstl:depgraph-maven-plugin:4.0.3:aggregate -DskipTests
